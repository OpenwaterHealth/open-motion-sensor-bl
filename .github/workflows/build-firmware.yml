name: Build bootloader

on:
  workflow_dispatch: {}
  push:
    branches: [ "main", "next" ]
    tags:
      - "*.*.*"
      - "*.*.*-rc.*"
      - "*.*.*-dev.*"

# id-token: write lets the job obtain a GitHub OIDC token, which Google Cloud
# exchanges (Workload Identity Federation) for a short-lived identity. No Google
# credential is stored in this repository. The federation binding only accepts
# tag refs of this repository, so branch builds cannot upload.
permissions:
  contents: write
  id-token: write

env:
  # Private artifact store for bootloader binaries (plan D7: the binary is no
  # longer a public release asset). Layout: gs://<bucket>/<repo>/<tag>/<repo>-<tag>.{bin,hex,elf} + SHA256SUMS
  GCS_BUCKET: openwater-firmware-artifacts
  WIF_PROVIDER: projects/341318872140/locations/global/workloadIdentityPools/github/providers/github-oidc
  UPLOADER_SA: sa-bl-artifact-uploader@openwater-cloud.iam.gserviceaccount.com
  # Read-only identity (roles/cloudkms.publicKeyViewer on the key ring, nothing else)
  # used on every build to confirm that the committed public key IS the KMS key.
  PUBKEY_READER_SA: sa-bl-pubkey-reader@openwater-cloud.iam.gserviceaccount.com
  KMS_KEY_VERSION: projects/openwater-cloud/locations/us-central1/keyRings/openmotion-firmware/cryptoKeys/sensor-fw-signing/cryptoKeyVersions/1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # ---------------------------
      # Determine build config from the ref:
      #   *-dev.* tag            -> Debug   (development pre-release)
      #   *-rc.* / X.Y.Z tag     -> Release (release candidate / final release)
      #   branch push / dispatch -> Debug
      # ---------------------------
      - name: Determine build config
        id: cfg
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            TAG_NAME=$(python3 -c "import json;print(json.load(open('$GITHUB_EVENT_PATH'))['release']['tag_name'])")
            IS_TAG=1
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME="$GITHUB_REF_NAME"; IS_TAG=1
          else
            TAG_NAME="$GITHUB_REF_NAME"; IS_TAG=0
          fi
          if [ "$IS_TAG" = "1" ] && [[ "$TAG_NAME" != *-dev.* ]]; then
            CONFIG=Release
          else
            CONFIG=Debug
          fi
          echo "config=$CONFIG" >> "$GITHUB_OUTPUT"
          echo "ref='$GITHUB_REF' event='$GITHUB_EVENT_NAME' tag='$TAG_NAME' -> build config: $CONFIG"

      # Regenerate the SECoreBin key file from key material kept OUT of git:
      #   - AES-128 key  : from the SECOREBIN_AES_KEY secret (base64 of the 16 raw bytes)
      #   - ECC pub key  : the committed py-tools/keys/ecdsa_public.pem, which is the
      #                    public half of the Google Cloud KMS signing key for this
      #                    product (see py-tools/export_public_key.py). The private
      #                    key exists only inside the KMS HSM and is never needed here.
      # se_key.s embeds the AES value, so it is .gitignored and produced at build time.
      - name: Regenerate se_key.s from key material
        env:
          SECOREBIN_AES_KEY: ${{ secrets.SECOREBIN_AES_KEY }}
        run: |
          if [ -z "$SECOREBIN_AES_KEY" ]; then
            echo "::error::SECOREBIN_AES_KEY secret is not set — cannot build SECoreBin." >&2
            exit 1
          fi
          python3 -m pip install --quiet --disable-pip-version-check cryptography==50.0.1
          # AES key (secret) -> raw 16 bytes
          printf '%s' "$SECOREBIN_AES_KEY" | base64 -d > "$RUNNER_TEMP/aes128.bin"
          if [ "$(wc -c < "$RUNNER_TEMP/aes128.bin")" -ne 16 ]; then
            echo "::error::Decoded AES key is not 16 bytes — check the SECOREBIN_AES_KEY secret." >&2
            exit 1
          fi
          # Public key X/Y (32 bytes each) from the committed public PEM
          python3 - "$RUNNER_TEMP" <<'PY'
          import sys
          from cryptography.hazmat.primitives import serialization
          tmp = sys.argv[1]
          pub = serialization.load_pem_public_key(open("py-tools/keys/ecdsa_public.pem", "rb").read())
          n = pub.public_numbers()
          open(f"{tmp}/pub_x.bin", "wb").write(n.x.to_bytes(32, "big"))
          open(f"{tmp}/pub_y.bin", "wb").write(n.y.to_bytes(32, "big"))
          PY
          python3 py-tools/gen_se_key_s.py \
            --aes-key   "$RUNNER_TEMP/aes128.bin" \
            --pub-key-x "$RUNNER_TEMP/pub_x.bin" \
            --pub-key-y "$RUNNER_TEMP/pub_y.bin"
          rm -f "$RUNNER_TEMP/aes128.bin"
          test -s SECoreBin/Startup/se_key.s && echo "se_key.s regenerated."

      # Fingerprint of the public key this bootloader will trust. Goes into the
      # release notes so a unit's trusted key can be traced to a KMS key version.
      - name: Fingerprint trusted public key
        id: pubkey
        run: |
          FP=$(openssl pkey -pubin -in py-tools/keys/ecdsa_public.pem -outform DER | openssl dgst -sha256 | awk '{print $2}')
          echo "fingerprint=$FP" >> "$GITHUB_OUTPUT"
          echo "Trusted signing key: sha256:$FP"

      # ---------------------------
      # Integrity check of the committed public key: fetch the public half of the
      # production signing key from Cloud KMS and fail the build if it is not the
      # PEM we just compiled in. Read-only federated identity; no stored credential.
      # Guards against a wrong or tampered PEM shipping in a bootloader.
      # ---------------------------
      - name: Authenticate to Google Cloud (public-key reader)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.PUBKEY_READER_SA }}

      - name: Verify committed public key against Cloud KMS
        run: |
          python3 -m pip install --quiet --disable-pip-version-check -r py-tools/requirements.txt
          python3 py-tools/export_public_key.py --kms-key "$KMS_KEY_VERSION" \
            --output py-tools/keys/ecdsa_public.pem --check

      - name: Pull build image
        run: docker pull ghcr.io/openwaterhealth/stm32-build-env:latest

      - name: Build inside container
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace \
            ghcr.io/openwaterhealth/stm32-build-env:latest \
            bash -lc "git config --global --add safe.directory /workspace && cmake --preset ${{ steps.cfg.outputs.config }} && cmake --build build/${{ steps.cfg.outputs.config }} --config ${{ steps.cfg.outputs.config }} --target all -j 10"

      # Guard: the objcopy POST_BUILD step must have produced both the .bin and
      # .hex (not just the .elf). Fail loudly here rather than shipping an
      # incomplete artifact that silently lacks the flashable images.
      - name: Verify build outputs (.bin/.hex/.elf)
        run: |
          OUT="build/${{ steps.cfg.outputs.config }}"
          echo "Contents of $OUT:"; ls -la "$OUT" || true
          missing=0
          for f in openmotion-bl.bin openmotion-bl.hex openmotion-bl.elf; do
            if [ ! -s "$OUT/$f" ]; then
              echo "::error::Expected build output missing or empty: $OUT/$f" >&2
              missing=1
            else
              echo "OK: $OUT/$f ($(wc -c < "$OUT/$f") bytes)"
            fi
          done
          [ "$missing" -eq 0 ]

      # The container writes build/ as root, so collect the outputs into a directory the
      # runner owns before adding checksums. Files are named <repository>-<ref>.<ext>
      # (e.g. open-motion-console-bl-1.2.0-rc.0.bin) so a stored binary is unambiguous
      # on its own, and nothing in the bucket is ever overwritten or shadowed.
      - name: Collect outputs and checksums
        id: sums
        run: |
          set -euo pipefail
          NAME="${{ github.event.repository.name }}-$(echo "$GITHUB_REF_NAME" | tr '/' '-')"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          mkdir -p _out
          for ext in bin hex elf; do
            cp "build/${{ steps.cfg.outputs.config }}/openmotion-bl.$ext" "_out/$NAME.$ext"
          done
          cd _out
          sha256sum "$NAME.bin" "$NAME.hex" "$NAME.elf" > SHA256SUMS
          cat SHA256SUMS
          echo "bin_sha256=$(awk -v f="$NAME.bin" '$2==f{print $1}' SHA256SUMS)" >> "$GITHUB_OUTPUT"

      # Debug builds (branch pushes, dispatch, *-dev.* tags) stay available as a
      # workflow artifact for developers. Release builds (rc / final tags) are
      # distributed only through the private bucket below; on a public repository
      # a workflow artifact is downloadable by anyone with a GitHub account.
      - name: Upload workflow artifact (Debug builds only)
        if: steps.cfg.outputs.config == 'Debug'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sums.outputs.name }}-${{ steps.cfg.outputs.config }}
          path: _out/*

      # ---------------------------
      # Tag builds: publish the binaries to the private artifact bucket.
      # Identity: GitHub OIDC -> Workload Identity Federation -> sa-bl-artifact-uploader,
      # which holds roles/storage.objectCreator only (write-once: cannot read,
      # delete or overwrite). Bucket retention prevents replacement by anyone else.
      # ---------------------------
      - name: Authenticate to Google Cloud (uploader)
        if: startsWith(github.ref, 'refs/tags/')
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.UPLOADER_SA }}

      - name: Set up gcloud
        if: startsWith(github.ref, 'refs/tags/')
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload binaries to the private artifact bucket
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          DEST="gs://${GCS_BUCKET}/${{ github.event.repository.name }}/${GITHUB_REF_NAME}/"
          cd _out
          # The uploader holds objectCreator only (write-once, no read). A folder-style
          # destination makes gcloud GET the prefix first, which is denied; copy each file
          # to its exact object name instead.
          for f in "${{ steps.sums.outputs.name }}".bin "${{ steps.sums.outputs.name }}".hex "${{ steps.sums.outputs.name }}".elf SHA256SUMS; do
            gcloud storage cp "$f" "${DEST}${f}"
          done
          echo "Uploaded to $DEST"

      - name: Detect release type
        id: reltype
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"

          if [[ "$TAG_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(rc|dev)\.[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unrecognized tag format: $TAG_NAME" >&2
            exit 1
          fi

      - name: Capture build metadata
        id: buildmeta
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "datetime=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          : > notes.md

          if [[ "${{ steps.reltype.outputs.prerelease }}" == "true" ]]; then
            echo "⚠️ **PRE-RELEASE – NOT FOR PRODUCTION**" >> notes.md
            echo "" >> notes.md
          fi

          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${GITHUB_REF_NAME}$" | head -n 1)

          if [ -z "$PREV_TAG" ]; then
            git log --pretty=format:"- %s" >> notes.md
          else
            git log "$PREV_TAG"..HEAD --pretty=format:"- %s" >> notes.md
          fi

          echo "" >> notes.md
          echo "" >> notes.md
          echo "---" >> notes.md
          echo "**Build SHA:** \`${{ steps.buildmeta.outputs.sha }}\`" >> notes.md
          echo "**Build Time:** ${{ steps.buildmeta.outputs.datetime }}" >> notes.md
          echo "**Build Config:** ${{ steps.cfg.outputs.config }}" >> notes.md
          echo "**Trusted signing key (SHA-256 of public key):** \`${{ steps.pubkey.outputs.fingerprint }}\`" >> notes.md
          echo "**${{ steps.sums.outputs.name }}.bin SHA-256:** \`${{ steps.sums.outputs.bin_sha256 }}\`" >> notes.md
          echo "**Binaries:** \`gs://${GCS_BUCKET}/${{ github.event.repository.name }}/${GITHUB_REF_NAME}/\` (private; access via Openwater Google Cloud)" >> notes.md

      # The release carries notes and the SBOM only. Binaries are in the private
      # bucket (plan D7); the firmware CI fetches them with its own federated identity.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ steps.reltype.outputs.prerelease }}
          body_path: notes.md
          overwrite_files: true
          make_latest: ${{ steps.reltype.outputs.prerelease == 'false' }}
          files: |
            sbom.cdx.json
